<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=https://denver-publishing-shortly-regime.trycloudflare.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainboard — redirecting…</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 24px; text-align: center;
  }
  .card { max-width: 460px; }
  .mark { font-size: 56px; line-height: 1; }
  h1 { font-size: 26px; margin: 18px 0 6px; }
  p { margin: 10px 0; color: #94a3b8; font-size: 15px; line-height: 1.5; }
  a.cta {
    display: inline-block; margin-top: 10px; padding: 12px 22px; border-radius: 10px;
    background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; font-size: 16px;
  }
  a.cta:active { transform: translateY(1px); }
  .dim { font-size: 13px; color: #64748b; }
  .spin {
    width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 50%;
    border: 3px solid #1e293b; border-top-color: #2563eb; animation: s 0.9s linear infinite;
  }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spin" aria-hidden="true"></div>
    <div class="mark" aria-hidden="true">🧠</div>
    <h1>Brainboard</h1>
    <p>Redirecting you to the live board…</p>
    <a class="cta" href="https://denver-publishing-shortly-regime.trycloudflare.com">Open the board →</a>
    <p class="dim">This link always points at the current tunnel URL and updates automatically
    whenever the host restarts its tunnel. If the board doesn't open, the host machine
    may be asleep — check back in a moment.</p>
  </div>
</body>
</html>
